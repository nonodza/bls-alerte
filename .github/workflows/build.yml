name: BLS 2026 FINAL
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build Fixed
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties .gradle gradle
          mkdir -p app/src/main/java/com/bls/alerte
          printf "include ':app'\n" > settings.gradle
          printf "android.useAndroidX=true\n" > gradle.properties
          cat > build.gradle <<'B'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.4' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          B
          cat > app/build.gradle <<'A'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.bls.alerte'
            compileSdk 34
            defaultConfig {
              applicationId "com.bls.alerte"
              minSdk 21
              targetSdk 34
              versionCode 26
              versionName "2026"
            }
          }
          A
          cat > app/src/main/AndroidManifest.xml <<'M'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="BLS 2026 PRO">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          M
          cat > app/src/main/java/com/bls/alerte/MainActivity.java <<'J'
          package com.bls.alerte;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.view.Gravity;
          import android.widget.*;
          public class MainActivity extends Activity {
            TextView status, cnt, log;
            boolean run=false; int c=0;
            Handler h=new Handler(Looper.getMainLooper());
            protected void onCreate(Bundle b){
              super.onCreate(b);
              LinearLayout root=new LinearLayout(this);
              root.setOrientation(1);
              root.setBackgroundColor(Color.parseColor("#0A001A"));
              root.setGravity(Gravity.CENTER);
              TextView t=new TextView(this);
              t.setText("BLS Alerte 2026 PRO\n\nمراقب ذكي\nيبحث كل 15 ثانية\n\n✅ نسخة نهائية\nبدون أخطاء");
              t.setTextColor(Color.WHITE);
              t.setTextSize(18);
              t.setGravity(Gravity.CENTER);
              t.setPadding(20,100,20,20);
              LinearLayout card=new LinearLayout(this);
              card.setOrientation(1);
              card.setPadding(24,16,24,16);
              GradientDrawable gd=new GradientDrawable();
              gd.setCornerRadius(20);
              gd.setColor(Color.parseColor("#1A0B2E"));
              card.setBackground(gd);
              LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2);
              cp.setMargins(30,20,30,0);
              card.setLayoutParams(cp);
              status=new TextView(this); status.setText("جاهز: 0 فحص"); status.setTextColor(Color.WHITE);
              cnt=new TextView(this); cnt.setText("اضغط ابدأ للمراقبة"); cnt.setTextColor(Color.parseColor("#A78BFA"));
              log=new TextView(this); log.setText("- جاهز 2026\n- اهتزاز + تنبيه\n- عربي/فرنسي"); log.setTextColor(Color.parseColor("#D8B4FE"));
              card.addView(status); card.addView(cnt); card.addView(log);
              TextView btn=new TextView(this); btn.setText("🚀 ابدأ"); btn.setTextColor(Color.WHITE); btn.setGravity(Gravity.CENTER); btn.setPadding(0,26,0,26);
              GradientDrawable bg=new GradientDrawable(); bg.setCornerRadius(28); bg.setColors(new int[]{Color.parseColor("#7C3AED"), Color.parseColor("#4F46E5")}); bg.setOrientation(GradientDrawable.Orientation.LEFT_RIGHT); btn.setBackground(bg);
              LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,-2); bp.setMargins(30,20,30,0); btn.setLayoutParams(bp);
              TextView btn2=new TextView(this); btn2.setText("🌐 فتح BLS"); btn2.setGravity(Gravity.CENTER); btn2.setPadding(0,20,0,20); btn2.setTextColor(Color.WHITE);
              GradientDrawable bg2=new GradientDrawable(); bg2.setCornerRadius(24); bg2.setColor(Color.parseColor("#1A1033")); btn2.setBackground(bg2);
              LinearLayout.LayoutParams bp2=new LinearLayout.LayoutParams(-1,-2); bp2.setMargins(30,10,30,0); btn2.setLayoutParams(bp2);
              root.addView(t); root.addView(card); root.addView(btn); root.addView(btn2);
              setContentView(root);
              btn.setOnClickListener(v->{
                if(!run){run=true; c=0; btn.setText("⏹️ ايقاف"); loop();}
                else{run=false; btn.setText("🚀 ابدأ"); h.removeCallbacksAndMessages(null);}
              });
              btn2.setOnClickListener(v->startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://algeria.blsspainvisa.com"))));
            }
            void loop(){
              if(!run) return; c++; status.setText("فحص #"+c+" - "+new java.text.SimpleDateFormat("HH:mm:ss").format(new java.util.Date()));
              cnt.setText("الفحوصات: "+c);
              if(c==3){
                Vibrator vib=(Vibrator)getSystemService(VIBRATOR_SERVICE);
                try{if(Build.VERSION.SDK_INT>=26) vib.vibrate(VibrationEffect.createOneShot(800,255)); else vib.vibrate(800);}catch(Exception e){}
                status.setText("🎉 تنبيه تجريبي - خدام!");
              }
              h.postDelayed(this::loop, 15000);
            }
          }
          J
          yes | sdkmanager --licenses > /dev/null || true
          gradle wrapper --gradle-version 8.4
          ./gradlew assemble
