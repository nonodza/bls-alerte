              private void openUrl(String url) {

                  try {

                      startActivity(
                              new Intent(
                                      Intent.ACTION_VIEW,
                                      Uri.parse(url)
                              )
                      );

                  } catch (Exception e) {

                      Toast.makeText(
                              this,
                              "Impossible d'ouvrir le lien",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              @Override
              protected void onResume() {

                  super.onResume();

                  if (lastCheck != null) {

                      lastCheck.setText(
                              "Dernier contrôle : " +
                                      prefs.getString(
                                              "lastCheck",
                                              "Aucun"
                                      )
                      );

                      checkCount.setText(
                              "Contrôles effectués : " +
                                      prefs.getInt(
                                              "checks",
                                              0
                                      )
                      );
                  }
              }

              public static class GradientCard
                      extends LinearLayout {

                  private final android.graphics.drawable
                          .GradientDrawable drawable;

                  public GradientCard(
                          Context context
                  ) {

                      super(context);

                      setOrientation(
                              VERTICAL
                      );

                      drawable =
                              new android.graphics.drawable
                                      .GradientDrawable();

                      drawable.setColor(
                              Color.WHITE
                      );

                      drawable.setCornerRadius(
                              context
                                      .getResources()
                                      .getDisplayMetrics()
                                      .density *
                                      18
                      );

                      drawable.setStroke(
                              (int) context
                                      .getResources()
                                      .getDisplayMetrics()
                                      .density,
                              Color.rgb(
                                      230,
                                      232,
                                      236
                              )
                      );

                      setBackground(drawable);

                      setElevation(
                              context
                                      .getResources()
                                      .getDisplayMetrics()
                                      .density *
                                      2
                      );
                  }

                  public void setStrokeColor(
                          int color
                  ) {

                      drawable.setStroke(
                              (int) (
                                      getResources()
                                              .getDisplayMetrics()
                                              .density *
                                              2
                              ),
                              color
                      );
                  }
              }
          }
