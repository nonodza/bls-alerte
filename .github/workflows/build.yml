name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. JAVA
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # =========================================================
      # 3. ANDROID SDK
      # =========================================================
      - name: Setup Android
        uses: android-actions/setup-android@v3


      # =========================================================
      # 4. CREATE PROJECT
      # =========================================================
      - name: Create Project
        shell: bash
        run: |

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/bls/alerte
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values


          # =====================================================
          # SETTINGS
          # =====================================================

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "BLSAlerteDZ"
include(":app")
EOF


          # =====================================================
          # GRADLE PROPERTIES
          # =====================================================

          cat > gradle.properties <<'EOF'
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2048m
EOF


          # =====================================================
          # ROOT BUILD
          # =====================================================

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF


          # =====================================================
          # APP BUILD
          # =====================================================

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bls.alerte'
    compileSdk 34

    defaultConfig {
        applicationId "com.bls.alerte"
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName "3.0 PRO"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {

    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    implementation "androidx.activity:activity-ktx:1.9.0"

    implementation "androidx.work:work-runtime-ktx:2.9.0"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.3"
}
EOF


          # =====================================================
          # ANDROID MANIFEST
          # =====================================================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission android:name="android.permission.INTERNET"/>
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
    <uses-permission android:name="android.permission.VIBRATE"/>

    <application
        android:allowBackup="true"
        android:label="BLS Alerte DZ"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="true">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF


          # =====================================================
          # COLORS / THEME
          # =====================================================

          cat > app/src/main/res/values/colors.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <color name="primary">#00695C</color>
    <color name="primary_dark">#004D40</color>

    <color name="accent">#00A896</color>

    <color name="background">#F5F7F9</color>
    <color name="card">#FFFFFF</color>

    <color name="text_main">#18212A</color>
    <color name="text_secondary">#6B7280</color>

    <color name="success">#168B55</color>
    <color name="danger">#D64545</color>
    <color name="warning">#D88A00</color>

</resources>
EOF


          cat > app/src/main/res/values/themes.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<resources>

    <style name="AppTheme"
        parent="Theme.Material3.DayNight.NoActionBar">

        <item name="android:fontFamily">sans</item>

        <item name="android:colorAccent">@color/accent</item>

        <item name="android:navigationBarColor">@color/background</item>

        <item name="android:statusBarColor">@color/primary_dark</item>

        <item name="android:windowLightStatusBar">false</item>

    </style>

</resources>
EOF


          # =====================================================
          # MAIN LAYOUT
          # =====================================================

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<ScrollView
    xmlns:android="http://schemas.android.com/apk/res/android"
    android:layout_width="match_parent"
