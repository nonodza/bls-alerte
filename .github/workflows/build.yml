name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create project
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties .gradle
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.bls.alerte'
              compileSdk 34
              defaultConfig { applicationId "com.bls.alerte"; minSdk 21; targetSdk 34; versionCode 12; versionName "12.0" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="BLS Alerte">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/bls/alerte/MainActivity.java << 'EOF'
          package com.bls.alerte;
          import android.app.Activity; import android.os.Bundle; import android.widget.TextView;
          public class MainActivity extends Activity {
              protected void onCreate(Bundle b){ super.onCreate(b); TextView t=new TextView(this); t.setText("BLS v12 FIXED - APK Ready!"); t.setTextSize(24); setContentView(t); }
          }
          EOF
          yes | sdkmanager --licenses > /dev/null || true
      - name: Build APK no cache
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: clean assembleDebug --no-daemon --rerun-tasks
          cache-disabled: true
          cache-read-only: false
      - name: Show APK location
        run: |
          echo "=== SEARCH APK ==="
          find . -name "*.apk" -type f -ls
          ls -lh app/build/outputs/apk/debug/ || echo "folder not found"
          ls -R app/build/ || echo "no build"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
