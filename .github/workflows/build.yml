                                              (dialog, which) -> {

                                                  prefs.edit()
                                                          .putString(
                                                                  "theme",
                                                                  items[which]
                                                          )
                                                          .apply();

                                                  buildSettings();
                                              }
                                      )
                                      .show();
                          }
                  );

                  box.addView(theme);

                  addGap(box, 10);

                  Button interval =
