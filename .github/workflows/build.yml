name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Create App
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties gradle
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties

          cat > build.gradle <<'ENDOFFILE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          ENDOFFILE

          cat > app/build.gradle <<'ENDOFFILE'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.bls.alerte'
              compileSdk 34
              defaultConfig {
                  applicationId "com.bls.alerte"
                  minSdk 23
                  targetSdk 34
                  versionCode 101
                  versionName "ULTRA"
              }
          }
          ENDOFFILE

          cat > app/src/main/AndroidManifest.xml <<'ENDOFFILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="BLS ULTRA">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          ENDOFFILE

          cat > app/src/main/java/com/bls/alerte/MainActivity.java <<'ENDOFFILE'
          package com.bls.alerte;
          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.view.Gravity;
          import android.widget.*;
          public class MainActivity extends Activity {
            TextView status,cnt,log; boolean run=false; int c=0; Handler h=new Handler(Looper.getMainLooper());
            protected void onCreate(Bundle b){ super.onCreate(b);
              ScrollView sv=new ScrollView(this); sv.setBackgroundColor(Color.parseColor("#0A001A"));
              LinearLayout root=new LinearLayout(this); root.setOrientation(1);
              LinearLayout header=new LinearLayout(this); header.setOrientation(1); header.setGravity(Gravity.CENTER); header.setPadding(20,40,20,20);
              TextView t1=new TextView(this); t1.setText("BLS ULTRA 2026"); t1.setTextColor(Color.WHITE); t1.setTextSize(22); t1.setTypeface(null,Typeface.BOLD); t1.setGravity(Gravity.CENTER);
              header.addView(t1);
              LinearLayout c2=card(); status=new TextView(this); status.setText("Ready"); status.setTextColor(Color.parseColor("#10B981")); status.setTypeface(null,Typeface.BOLD);
              cnt=new TextView(this); cnt.setText("Checks: 0"); cnt.setTextColor(Color.parseColor("#A78BFA"));
              log=new TextView(this); log.setText("Log: Ready\n"); log.setTextColor(Color.parseColor("#D1D5DB"));
              c2.addView(status); c2.addView(cnt); c2.addView(log);
              TextView btn1=btn("Start", new int[]{Color.parseColor("#7C3AED"),Color.parseColor("#4F46E5")});
              TextView btn2=btn("Test Alert", new int[]{Color.parseColor("#1A1033"),Color.parseColor("#2D1B4E")});
              TextView btn3=btn("Open BLS", new int[]{Color.parseColor("#0F172A"),Color.parseColor("#1E293B")});
              root.addView(header); root.addView(c2); root.addView(btn1); root.addView(btn2); root.addView(btn3);
              sv.addView(root); setContentView(sv);
              btn1.setOnClickListener(v->{ if(!run){run=true;c=0;btn1.setText("STOP");status.setText("Monitoring");loop();} else{run=false;btn1.setText("Start");status.setText("Stopped");h.removeCallbacksAndMessages(null);} });
              btn2.setOnClickListener(v->{ Vibrator vib=(Vibrator)getSystemService(VIBRATOR_SERVICE); try{ if(Build.VERSION.SDK_INT>=26) vib.vibrate(VibrationEffect.createOneShot(1000,255)); else vib.vibrate(1000);}catch(Exception e){} Toast.makeText(this,"Alert OK!",1).show(); });
              btn3.setOnClickListener(v->startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://algeria.blsspainvisa.com"))));
            }
            LinearLayout card(){ LinearLayout c=new LinearLayout(this); c.setOrientation(1); c.setPadding(18,14,18,14); GradientDrawable gd=new GradientDrawable(); gd.setCornerRadius(16); gd.setColor(Color.parseColor("#1A0B2E")); gd.setStroke(1,Color.parseColor("#2D1B4E")); c.setBackground(gd); LinearLayout.LayoutParams cp=new LinearLayout.LayoutParams(-1,-2); cp.setMargins(14,10,14,0); c.setLayoutParams(cp); return c; }
            TextView btn(String t,int[] col){ TextView b=new TextView(this); b.setText(t); b.setTextColor(Color.WHITE); b.setGravity(Gravity.CENTER); b.setPadding(0,18,0,18); b.setTypeface(null,Typeface.BOLD); GradientDrawable bg=new GradientDrawable(); bg.setCornerRadius(12); bg.setColors(col); bg.setOrientation(GradientDrawable.Orientation.LEFT_RIGHT); b.setBackground(bg); LinearLayout.LayoutParams bp=new LinearLayout.LayoutParams(-1,-2); bp.setMargins(14,8,14,0); b.setLayoutParams(bp); return b; }
            void loop(){ if(!run) return; c++; cnt.setText("Checks: "+c); log.setText(log.getText()+"Check "+c+"\n"); h.postDelayed(this::loop, 15000L); }
          }
          ENDOFFILE

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-DZ-APK
          path: app/build/outputs/apk/debug/app-debug.apk
