name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - name: Create V6.2 Full Features
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/bls/alerte
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BLSAlerte"; include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.bls.alerte'; compileSdk 34; defaultConfig { applicationId 'com.bls.alerte'; minSdk 23; targetSdk 34; versionCode 16; versionName '6.2-FULL' } }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:label="BLS ULTRA PRO" android:theme="@android:style/Theme.Light.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".MonitorService" android:exported="false" android:foregroundServiceType="dataSync"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/bls/alerte/MonitorService.java <<'EOF'
          package com.bls.alerte;
          import android.app.*; import android.content.Intent; import android.os.IBinder; import androidx.core.app.NotificationCompat;
          public class MonitorService extends Service {
            public static boolean isRunning=false; public static String currentCity="Alger";
            @Override public IBinder onBind(Intent i){return null;}
            @Override public int onStartCommand(Intent intent, int flags, int id){
              String action=intent!=null?intent.getStringExtra("action"):"start";
              if("stop".equals(action)){ stopForeground(true); stopSelf(); isRunning=false; return START_NOT_STICKY; }
              isRunning=true;
              String channelId="bls_monitor_channel";
              NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE);
              if(android.os.Build.VERSION.SDK_INT>=26){ NotificationChannel ch=new NotificationChannel(channelId,"BLS Surveillance",NotificationManager.IMPORTANCE_LOW); ch.setDescription("Surveillance BLS en arriere-plan"); nm.createNotificationChannel(ch); }
              Intent stopIntent=new Intent(this, MonitorService.class); stopIntent.putExtra("action","stop");
              PendingIntent stopPI=PendingIntent.getService(this,1,stopIntent,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
              Intent openIntent=new Intent(this, MainActivity.class); PendingIntent openPI=PendingIntent.getActivity(this,0,openIntent,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);
              NotificationCompat.Builder builder=new NotificationCompat.Builder(this,channelId)
                .setContentTitle("BLS ULTRA • Surveillance active")
                .setContentText("📍 "+currentCity+" • Verif toutes les 60s • Legal")
                .setSmallIcon(android.R.drawable.ic_popup_sync)
                .setOngoing(true)
                .setContentIntent(openPI)
                .addAction(android.R.drawable.ic_media_pause,"Pause",stopPI)
                .addAction(android.R.drawable.ic_delete,"Stop",stopPI);
              startForeground(101, builder.build());
              return START_STICKY;
            }
          }
          EOF
          cat > app/src/main/java/com/bls/alerte/MainActivity.java <<'EOF'
          package com.bls.alerte;
          import android.app.Activity; import android.content.Intent; import android.content.SharedPreferences; import android.graphics.Color; import android.graphics.Typeface; import android.graphics.drawable.GradientDrawable; import android.os.*; import android.view.Gravity; import android.widget.*; import java.text.SimpleDateFormat; import java
