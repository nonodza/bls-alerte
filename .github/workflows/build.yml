name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Verify MainActivity source
        run: |
          echo "===== MAINACTIVITY SOURCE CHECK ====="

          if grep -q 'BLS LIVE TEST 251' app/src/main/java/com/bls/rendezvous/MainActivity.java; then
            echo "RESULT: BLS LIVE TEST 251 FOUND IN SOURCE"
          else
            echo "RESULT: BLS LIVE TEST 251 NOT FOUND IN SOURCE"
            exit 1
          fi

          echo "===== END SOURCE CHECK ====="

      - name: Build Debug APK
        run: |
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon

      - name: Check APK
        run: |
          echo "===== APK CHECK ====="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "===== END APK CHECK ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-test-251
          path: app/build/outputs/apk/debug/app-debug.apk
