name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Create project folders
        run: |
          mkdir -p app/src/main/java/com/bls/alerte
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Create settings.gradle
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "BLS-Rendez-Vous"
          include(":app")
          EOF

      - name: Create root build.gradle
        run: |
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

      - name: Create gradle.properties
        run: |
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

      - name: Create app build.gradle
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.bls.alerte'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.bls.alerte'
                  minSdk 23
                  targetSdk 35
                  versionCode 10
                  versionName "10.0"
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.core:core:1.16.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

      - name: Create AndroidManifest.xml
        run: |
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="BLS Rendez-Vous"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".MonitorService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

              </application>

          </manifest>
          EOF

      - name: Create styles.xml
        run: |
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#0B1220</item>
                  <item name="android:navigationBarColor">#0B1220</item>
                  <item name="colorPrimary">#2563EB</item>
                  <item name="colorSecondary">#10B981</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>

          </resources>
          EOF

      - name: Create MainActivity.java
        run: |
          cat > app/src/main/java/com/bls/alerte/MainActivity.java <<'EOF'
          package com.bls.alerte;

          import android.Manifest;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.text.Editable;
          import android.text.TextWatcher;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Space;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import java.util.Locale;

          public class MainActivity extends AppCompatActivity {

              private static final String PREFS = "bls_settings";

              private SharedPreferences prefs;
              private TextView monitoringStatus;
              private TextView lastCheck;
              private TextView checkCount;
              private String selectedCenter = "Alger";

              private final int blue = Color.rgb(37, 99, 235);
              private final int green = Color.rgb(16, 185, 129);
              private final int red = Color.rgb(239, 68, 68);

              @Override
              protected void onCreate(@Nullable Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  selectedCenter = prefs.getString("center", "Alger");

                  if (Build.VERSION.SDK_INT >= 33 &&
                          ContextCompat.checkSelfPermission(
                                  this,
                                  Manifest.permission.POST_NOTIFICATIONS
                          ) != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.POST_NOTIFICATIONS},
                              100
                      );
                  }

                  buildHome();
              }

              private int dp(int value) {
                  return (int) (
                          value *
                                  getResources()
                                          .getDisplayMetrics()
                                          .density +
                                  0.5f
                  );
              }

              private TextView text(
                      String value,
                      float size,
                      int color,
                      boolean bold
              ) {
                  TextView t = new TextView(this);
                  t.setText(value);
                  t.setTextSize(size);
                  t.setTextColor(color);
                  t.setGravity(Gravity.CENTER_VERTICAL);

                  if (bold) {
                      t.setTypeface(
                              Typeface.DEFAULT,
                              Typeface.BOLD
                      );
                  }

                  return t;
              }

              private LinearLayout vertical() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  return l;
              }

              private LinearLayout horizontal() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  l.setGravity(Gravity.CENTER_VERTICAL);
                  return l;
              }

              private GradientCard card() {
                  GradientCard c = new GradientCard(this);
                  c.setPadding(
                          dp(16),
                          dp(16),
                          dp(16),
                          dp(16)
                  );
                  return c;
              }

              private void addGap(
                      LinearLayout parent,
                      int height
              ) {
                  Space s = new Space(this);

                  parent.addView(
                          s,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(height)
                          )
                  );
              }

              private void addHorizontalGap(
                      LinearLayout parent,
                      int width
              ) {
                  Space s = new Space(this);

                  parent.addView(
                          s,
                          new LinearLayout.LayoutParams(
                                  dp(width),
                                  1
                          )
                  );
              }

              private Button actionButton(String title) {
                  Button b = new Button(this);

                  b.setText(title);
                  b.setAllCaps(false);
                  b.setTextSize(14);
                  b.setTextColor(Color.WHITE);
                  b.setBackgroundColor(blue);

                  return b;
              }

              private void buildHome() {

                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);

                  LinearLayout root = vertical();

                  root.setPadding(
                          dp(18),
                          dp(18),
                          dp(18),
                          dp(24)
                  );

                  scroll.addView(root);
                  setContentView(scroll);

                  LinearLayout header = horizontal();

                  LinearLayout titleBox = vertical();

                  titleBox.addView(
                          text(
                                  "Bonjour 👋",
                                  16,
                                  Color.GRAY,
                                  false
                          )
                  );

                  titleBox.addView(
                          text(
                                  "BLS Rendez-Vous",
                                  27,
                                  Color.BLACK,
                                  true
                          )
                  );

                  header.addView(
                          titleBox,
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  Button settings = actionButton("⚙");

                  settings.setTextSize(21);
                  settings.setBackgroundColor(Color.TRANSPARENT);
                  settings.setTextColor(Color.DKGRAY);

                  settings.setOnClickListener(
                          v -> buildSettings()
                  );

                  header.addView(
                          settings,
                          new LinearLayout.LayoutParams(
                                  dp(55),
                                  dp(55)
                          )
                  );

                  root.addView(header);

                  addGap(root, 18);

                  EditText search = new EditText(this);

                  search.setHint(
                          "🔎  Rechercher un centre..."
                  );

                  search.setSingleLine(true);
                  search.setPadding(
                          dp(16),
                          0,
                          dp(16),
                          0
                  );

                  root.addView(
                          search,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(52)
                          )
                  );

                  addGap(root, 20);

                  root.addView(
                          text(
                                  "Continuez à surveiller",
                                  20,
                                  Color.BLACK,
                                  true
                          )
                  );

                  addGap(root, 10);

                  LinearLayout centers = horizontal();

                  LinearLayout alg =
                          centerCard(
                                  "🇩🇿",
                                  "Alger",
                                  "Centre ALG"
                          );

                  LinearLayout oran =
                          centerCard(
                                  "🇩🇿",
                                  "Oran",
                                  "Centre ORN"
                          );

                  LinearLayout annaba =
                          centerCard(
                                  "🇩🇿",
                                  "Annaba",
                                  "Centre ANN"
                          );

                  centers.addView(
                          alg,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(145),
                                  1
                          )
                  );

                  addHorizontalGap(centers, 8);

                  centers.addView(
                          oran,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(145),
                                  1
                          )
                  );

                  addHorizontalGap(centers, 8);

                  centers.addView(
                          annaba,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(145),
                                  1
                          )
                  );

                  root.addView(centers);

                  addGap(root, 22);

                  root.addView(
                          text(
                                  "Accès rapide",
                                  20,
                                  Color.BLACK,
                                  true
                          )
                  );

                  addGap(root, 10);

                  LinearLayout row1 = horizontal();

                  LinearLayout alert =
                          quickCard("🔔", "Alerte");

                  LinearLayout bls =
                          quickCard("🌐", "BLS");

                  LinearLayout start =
                          quickCard("▶", "Start");

                  row1.addView(
                          alert,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(100),
                                  1
                          )
                  );

                  addHorizontalGap(row1, 8);

                  row1.addView(
                          bls,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(100),
                                  1
                          )
                  );

                  addHorizontalGap(row1, 8);

                  row1.addView(
                          start,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(100),
                                  1
                          )
                  );

                  root.addView(row1);

                  addGap(root, 8);

                  LinearLayout row2 = horizontal();

                  LinearLayout stats =
                          quickCard("📊", "Stats");

                  LinearLayout settingsCard =
                          quickCard("⚙", "Réglages");

                  row2.addView(
                          stats,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(100),
                                  1
                          )
                  );

                  addHorizontalGap(row2, 8);

                  row2.addView(
                          settingsCard,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(100),
                                  1
                          )
                  );

                  root.addView(row2);

                  addGap(root, 22);

                  GradientCard monitor = card();

                  LinearLayout monitorHeader =
                          horizontal();

                  TextView monitorTitle =
                          text(
                                  "Surveillance BLS",
                                  20,
                                  Color.BLACK,
                                  true
                          );

                  monitoringStatus =
                          text(
                                  "● Arrêtée",
                                  14,
                                  red,
                                  true
                          );

                  monitorHeader.addView(
                          monitorTitle,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(45),
                                  1
                          )
                  );

                  monitorHeader.addView(
                          monitoringStatus
                  );

                  monitor.addView(monitorHeader);

                  monitor.addView(
                          text(
                                  "Centre surveillé : " +
                                          selectedCenter,
                                  15,
                                  Color.DKGRAY,
                                  false
                          )
                  );

                  addGap(monitor, 5);

                  lastCheck =
                          text(
                                  "Dernier contrôle : " +
                                          prefs.getString(
                                                  "lastCheck",
                                                  "Aucun"
                                          ),
                                  13,
                                  Color.GRAY,
                                  false
                          );

                  monitor.addView(lastCheck);

                  addGap(monitor, 4);

                  checkCount =
                          text(
                                  "Contrôles effectués : " +
                                          prefs.getInt(
                                                  "checks",
                                                  0
                                          ),
                                  13,
                                  Color.GRAY,
                                  false
                          );

                  monitor.addView(checkCount);

                  addGap(monitor, 14);

                  LinearLayout buttons = horizontal();

                  Button startButton =
                          actionButton("▶  Démarrer");

                  Button stopButton =
                          actionButton("■  Arrêter");

                  startButton.setOnClickListener(
                          v -> startMonitoring()
                  );

                  stopButton.setOnClickListener(
                          v -> stopMonitoring()
                  );

                  buttons.addView(
                          startButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(50),
                                  1
                          )
                  );

                  addHorizontalGap(buttons, 10);

                  buttons.addView(
                          stopButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(50),
                                  1
                          )
                  );

                  monitor.addView(buttons);

                  root.addView(monitor);

                  addGap(root, 18);

                  TextView info =
                          text(
                                  "Surveillance des services BLS officiels.\n" +
                                          "Aucun contournement de CAPTCHA ou de protection anti-bot.",
                                  13,
                                  Color.GRAY,
                                  false
                          );

                  info.setGravity(Gravity.CENTER);

                  root.addView(info);

                  alert.setOnClickListener(
                          v -> buildAlerts()
                  );

                  bls.setOnClickListener(
                          v -> openUrl(
                                  "https://algeria.blsspainvisa.com/"
                          )
                  );

                  stats.setOnClickListener(
                          v -> buildStats()
                  );

                  settingsCard.setOnClickListener(
                          v -> buildSettings()
                  );

                  alg.setOnClickListener(
                          v -> selectCenter("Alger")
                  );

                  oran.setOnClickListener(
                          v -> selectCenter("Oran")
                  );

                  annaba.setOnClickListener(
                          v -> selectCenter("Annaba")
                  );

                  start.setOnClickListener(
                          v -> startMonitoring()
                  );

                  search.addTextChangedListener(
                          new TextWatcher() {

                              @Override
                              public void beforeTextChanged(
                                      CharSequence s,
                                      int start,
                                      int count,
                                      int after
                              ) {}

                              @Override
                              public void onTextChanged(
                                      CharSequence s,
                                      int start,
                                      int before,
                                      int count
                              ) {

                                  String q =
                                          s.toString()
                                                  .toLowerCase(
                                                          Locale.ROOT
                                                  );

                                  alg.setVisibility(
                                          "alger".contains(q)
                                                  ? View.VISIBLE
                                                  : View.GONE
                                  );

                                  oran.setVisibility(
                                          "oran".contains(q)
                                                  ? View.VISIBLE
                                                  : View.GONE
                                  );

                                  annaba.setVisibility(
                                          "annaba".contains(q)
                                                  ? View.VISIBLE
                                                  : View.GONE
                                  );
                              }

                              @Override
                              public void afterTextChanged(
                                      Editable s
                              ) {}
                          }
                  );
              }

              private LinearLayout centerCard(
                      String icon,
                      String name,
                      String subtitle
              ) {

                  GradientCard c = card();

                  TextView i =
                          text(
                                  icon,
                                  27,
                                  Color.BLACK,
                                  false
                          );

                  i.setGravity(Gravity.CENTER);

                  TextView n =
                          text(
                                  name,
                                  17,
                                  Color.BLACK,
                                  true
                          );

                  n.setGravity(Gravity.CENTER);

                  TextView sub =
                          text(
                                  subtitle,
                                  11,
                                  Color.GRAY,
                                  false
                          );

                  sub.setGravity(Gravity.CENTER);

                  c.addView(
                          i,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(45)
                          )
                  );

                  c.addView(n);
                  c.addView(sub);

                  if (name.equals(selectedCenter)) {
                      c.setStrokeColor(blue);
                  }

                  return c;
              }

              private LinearLayout quickCard(
                      String icon,
                      String name
              ) {

                  GradientCard c = card();

                  c.setGravity(Gravity.CENTER);

                  TextView i =
                          text(
                                  icon,
                                  25,
                                  Color.BLACK,
                                  false
                          );

                  i.setGravity(Gravity.CENTER);

                  TextView n =
                          text(
                                  name,
                                  14,
                                  Color.BLACK,
                                  true
                          );

                  n.setGravity(Gravity.CENTER);

                  c.addView(
                          i,
                          new LinearLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  dp(42)
                          )
                  );

                  c.addView(n);

                  return c;
              }

              private void selectCenter(
                      String center
              ) {

                  selectedCenter = center;

                  prefs.edit()
                          .putString(
                                  "center",
                                  center
                          )
                          .apply();

                  Toast.makeText(
                          this,
                          "Centre sélectionné : " +
                                  center,
                          Toast.LENGTH_SHORT
                  ).show();

                  buildHome();
              }

              private void startMonitoring() {

                  Intent i =
                          new Intent(
                                  this,
                                  MonitorService.class
                          );

                  i.setAction(
                          MonitorService.ACTION_START
                  );

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      ContextCompat.startForegroundService(
                              this,
                              i
                      );

                  } else {

                      startService(i);
                  }

                  if (monitoringStatus != null) {

                      monitoringStatus.setText(
                              "● Active"
                      );

                      monitoringStatus.setTextColor(
                              green
                      );
                  }

                  Toast.makeText(
                          this,
                          "Surveillance démarrée",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private void stopMonitoring() {

                  Intent i =
                          new Intent(
                                  this,
                                  MonitorService.class
                          );

                  i.setAction(
                          MonitorService.ACTION_STOP
                  );

                  startService(i);

                  if (monitoringStatus != null) {

                      monitoringStatus.setText(
                              "● Arrêtée"
                      );

                      monitoringStatus.setTextColor(
                              red
                      );
                  }

                  Toast.makeText(
                          this,
                          "Surveillance arrêtée",
                          Toast.LENGTH_SHORT
                  ).show();
              }

              private void buildAlerts() {

                  LinearLayout box = vertical();

                  box.setPadding(
                          dp(22),
                          dp(5),
                          dp(22),
                          dp(5)
                  );

                  box.addView(
                          text(
                                  "🔔  Alertes",
                                  22,
                                  Color.BLACK,
                                  true
                          )
                  );

                  addGap(box, 15);

                  box.addView(
                          text(
                                  "Recevez une notification lorsqu'un changement est détecté.",
                                  14,
                                  Color.GRAY,
                                  false
                          )
                  );

                  addGap(box, 15);

                  Button notifications =
                          actionButton(
                                  prefs.getBoolean(
                                          "notifications",
                                          true
                                  )
                                          ? "🔔 Notifications activées"
                                          : "🔕 Notifications désactivées"
                          );

                  notifications.setOnClickListener(
                          v -> {

                              boolean value =
                                      !prefs.getBoolean(
                                              "notifications",
                                              true
                                      );

                              prefs.edit()
                                      .putBoolean(
                                              "notifications",
                                              value
                                      )
                                      .apply();

                              buildAlerts();
                          }
                  );

                  box.addView(notifications);

                  addGap(box, 10);

                  Button website =
                          actionButton(
                                  "🌐 Ouvrir BLS"
                          );

                  website.setOnClickListener(
                          v -> openUrl(
                                  "https://algeria.blsspainvisa.com/"
                          )
                  );

                  box.addView(website);

                  new AlertDialog.Builder(this)
                          .setView(box)
                          .setPositiveButton(
                                  "Fermer",
                                  null
                          )
                          .show();
              }

              private void buildStats() {

                  LinearLayout box = vertical();

                  box.setPadding(
                          dp(22),
                          dp(10),
                          dp(22),
                          dp(5)
                  );

                  box.addView(
                          text(
                                  "📊  Statistiques",
                                  23,
                                  Color.BLACK,
                                  true
                          )
                  );

                  addGap(box, 20);

                  addStat(
                          box,
                          "Centre surveillé",
                          selectedCenter
                  );

                  addStat(
                          box,
                          "Contrôles effectués",
                          String.valueOf(
                                  prefs.getInt(
                                          "checks",
                                          0
                                  )
                          )
                  );

                  addStat(
                          box,
                          "Dernier contrôle",
                          prefs.getString(
                                  "lastCheck",
                                  "Aucun"
                          )
                  );

                  new AlertDialog.Builder(this)
                          .setView(box)
                          .setPositiveButton(
                                  "Fermer",
                                  null
                          )
                          .show();
              }

              private void addStat(
                      LinearLayout box,
                      String label,
                      String value
              ) {

                  box.addView(
                          text(
                                  label,
                                  13,
                                  Color.GRAY,
                                  false
                          )
                  );

                  box.addView(
                          text(
                                  value,
                                  17,
                                  Color.BLACK,
                                  true
                          )
                  );

                  addGap(box, 13);
              }

              private void buildSettings() {

                  LinearLayout box = vertical();

                  box.setPadding(
                          dp(20),
                          dp(5),
                          dp(20),
                          dp(5)
                  );

                  box.addView(
                          text(
                                  "⚙  Réglages",
                                  23,
                                  Color.BLACK,
                                  true
                          )
                  );

                  addGap(box, 18);

                  Button center =
                          actionButton(
                                  "Centre : " +
                                          selectedCenter
                          );

                  center.setOnClickListener(
                          v -> {

                              String[] items = {
                                      "Alger",
                                      "Oran",
                                      "Annaba"
                              };

                              new AlertDialog.Builder(this)
                                      .setTitle(
                                              "Choisir le centre"
