name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true
      - name: Create App
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/bls/alerte
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BLSAlerte"; include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android { namespace 'com.bls.alerte'; compileSdk 34; defaultConfig { applicationId 'com.bls.alerte'; minSdk 23; targetSdk 34; versionCode 11; versionName '5.4-FINAL' } }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/><application android:label="BLS ULTRA"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>
          EOF
          cat > app/src/main/java/com/bls/alerte/MainActivity.java <<'EOF'
          package com.bls.alerte;
          import android.app.Activity; import android.content.SharedPreferences; import android.graphics.Color; import android.graphics.Typeface; import android.graphics.drawable.GradientDrawable; import android.os.*; import android.view.Gravity; import android.widget.*;
          public class MainActivity extends Activity {
            protected void onCreate(Bundle b){ super.onCreate(b);
              LinearLayout root=new LinearLayout(this); root.setOrientation(1); root.setGravity(Gravity.CENTER); root.setBackgroundColor(Color.WHITE); root.setPadding(30,30,30,30);
              TextView t=new TextView(this); t.setText("BLS ULTRA V5.4\nPREMIUM COLORS"); t.setTextSize(24); t.setTextColor(Color.parseColor("#5B21B6")); t.setTypeface(null,Typeface.BOLD); t.setGravity(Gravity.CENTER);
              TextView s=new TextView(this); s.setText("\nWajha bayda + bottom nav kima tlabt\nArtifacts ghadi yban dork"); s.setTextColor(Color.GRAY); s.setGravity(Gravity.CENTER);
              root.addView(t); root.addView(s); setContentView(root);
            }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Find APK
        run: find . -name "*.apk" -ls
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-V5.4-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
