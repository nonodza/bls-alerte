name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Create Android Project
        shell: bash
        run: |
          rm -rf app build.gradle settings.gradle gradle.properties
          mkdir -p app/src/main/java/com/bls/alerte
          
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BLSAlerte"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.bls.alerte'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.bls.alerte'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:allowBackup="true" android:label="BLS ULTRA" android:supportsRtl="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/bls/alerte/MainActivity.java <<'EOF'
          package com.bls.alerte;
          import android.app.Activity;
          import android.os.*;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.view.Gravity;
          import android.widget.*;
          public class MainActivity extends Activity {
              private TextView status, counter, log;
              private boolean monitoring = false;
              private int checks = 0;
              private final Handler handler = new Handler(Looper.getMainLooper());
              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.rgb(10, 0, 26));
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(0, 10, 0, 20);
                  TextView title = new TextView(this);
                  title.setText("BLS ULTRA 2026");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  title.setGravity(Gravity.CENTER);
                  title.setPadding(10, 35, 10, 25);
                  root.addView(title);
                  LinearLayout info = createCard();
                  status = new TextView(this); status.setText("● READY"); status.setTextColor(Color.rgb(16, 185, 129)); status.setTextSize(17); status.setTypeface(Typeface.DEFAULT, Typeface.BOLD); status.setPadding(5,5,5,12);
                  counter = new TextView(this); counter.setText("Checks: 0"); counter.setTextColor(Color.rgb(167, 139, 250)); counter.setTextSize(16); counter.setPadding(5,5,5,12);
                  log = new TextView(this); log.setText("Log:\nReady...\n"); log.setTextColor(Color.rgb(209, 213, 219)); log.setTextSize(14); log.setPadding(5,5,5,5);
                  info.addView(status); info.addView(counter); info.addView(log); root.addView(info);
                  TextView start = createButton("START"); TextView test = createButton("TEST ALERT"); TextView open = createButton("OPEN BLS");
                  root.addView(start); root.addView(test); root.addView(open);
                  scroll.addView(root); setContentView(scroll);
                  start.setOnClickListener(v -> {
                      if (!monitoring) { monitoring = true; checks = 0; start.setText("STOP"); status.setText("● MONITORING..."); status.setTextColor(Color.rgb(245, 158, 11)); log.setText(log.getText()+"["+checks+"] Started monitoring...\n"); loop(); }
                      else { monitoring = false; start.setText("START"); status.setText("● READY"); status.setTextColor(Color.rgb(16, 185, 129)); handler.removeCallbacksAndMessages(null); log.setText(log.getText()+"Stopped.\n"); }
                  });
                  test.setOnClickListener(v -> {
                      Vibrator vib = (Vibrator) getSystemService(VIBRATOR_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) vib.vibrate(VibrationEffect.createOneShot(1000, 255)); else vib.vibrate(1000);
                      Toast.makeText(this, "🔔 Alerte OK!", Toast.LENGTH_LONG).show();
                      log.setText(log.getText()+"Test alerte OK\n");
                  });
                  open.setOnClick
