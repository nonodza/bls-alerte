name: Build APK

concurrency:
  group: build-apk-main
  cancel-in-progress: true

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.4
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.4-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Verify Gradle version
        run: |
          gradle --version

      - name: Verify MainActivity source
        run: |
          echo "===== MAINACTIVITY SOURCE CHECK ====="
          if grep -q 'BLS Rendez-Vous' app/src/main/java/com/bls/rendezvous/MainActivity.java; then
            echo "RESULT: BLS Rendez-Vous FOUND IN SOURCE"
          else
            echo "RESULT: BLS Rendez-Vous NOT FOUND IN SOURCE"
          fi
          echo "===== END SOURCE CHECK ====="

      - name: Build Debug APK
        run: |
          gradle clean --no-daemon
          gradle assembleDebug
