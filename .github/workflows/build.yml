      - name: Create MonitorService.java
        run: |
          cat > app/src/main/java/com/bls/alerte/MonitorService.java <<'EOF'
          package com.bls.alerte;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Handler;
          import android.os.IBinder;

          import androidx.annotation.Nullable;
          import androidx.core.app.NotificationCompat;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MonitorService extends Service {

              public static final String ACTION_START =
                      "com.bls.alerte.START";

              public static final String ACTION_STOP =
                      "com.bls.alerte.STOP";

              private static final String CHANNEL_ID =
                      "BLS_MONITOR";

              private final Handler handler =
                      new Handler();

              private boolean running = false;

              private final Runnable monitorRunnable =
                      new Runnable() {

                          @Override
                          public void run() {

                              if (!running) {
                                  return;
                              }

                              performCheck();

                              int seconds =
                                      getSharedPreferences(
                                              "bls_settings",
                                              MODE_PRIVATE
                                      ).getInt(
                                              "interval",
                                              60
                                      );

                              handler.postDelayed(
                                      this,
                                      seconds * 1000L
                              );
                          }
                      };

              @Override
              public void onCreate() {

                  super.onCreate();

                  createChannel();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId
              ) {

                  if (intent != null &&
                          ACTION_STOP.equals(
                                  intent.getAction()
                          )) {

                      stopMonitoring();

                      return START_NOT_STICKY;
                  }

                  startForeground(
                          2001,
                          createNotification(
                                  "Surveillance BLS active"
                          )
                  );

                  if (!running) {

                      running = true;

                      handler.removeCallbacks(
                              monitorRunnable
                      );

                      handler.post(
                              monitorRunnable
                      );
                  }

                  return START_STICKY;
              }

              private void performCheck() {

                  new Thread(() -> {

                      SharedPreferences prefs =
                              getSharedPreferences(
                                      "bls_settings",
                                      MODE_PRIVATE
                              );

                      String center =
                              prefs.getString(
                                      "center",
                                      "Alger"
                              );

                      String url;

                      if ("Oran".equals(center)) {

                          url =
                                  "https://algeria.blsspainvisa.com/oran/";

                      } else if ("Annaba".equals(center)) {

                          url =
                                  "https://algeria.blsspainvisa.com/";

                      } else {

                          url =
                                  "https://algeria.blsspainvisa.com/algiers/";
                      }

                      boolean success =
                              checkWebsite(url);

                      int checks =
                              prefs.getInt(
                                      "checks",
                                      0
                              ) + 1;

                      String now =
                              new SimpleDateFormat(
                                      "dd/MM/yyyy HH:mm:ss",
                                      Locale.getDefault()
                              ).format(
                                      new Date()
                              );

                      prefs.edit()
                              .putInt(
                                      "checks",
                                      checks
                              )
                              .putString(
                                      "lastCheck",
                                      now
                              )
                              .apply();

                      if (success) {

                          updateNotification(
                                  "Dernier contrôle : " +
                                          now
                          );
                      }

                  }).start();
              }

              private boolean checkWebsite(
                      String urlString
              ) {

                  HttpURLConnection connection = null;

                  try {

                      URL url =
                              new URL(urlString);

                      connection =
                              (HttpURLConnection)
                                      url.openConnection();

                      connection.setRequestMethod("GET");

                      connection.setConnectTimeout(
                              15000
                      );

                      connection.setReadTimeout(
                              15000
                      );

                      connection.setRequestProperty(
                              "User-Agent",
                              "Mozilla/5.0"
                      );

                      int response =
                              connection.getResponseCode();

                      if (response >= 200 &&
                              response < 400) {

                          BufferedReader reader =
                                  new BufferedReader(
                                          new InputStreamReader(
                                                  connection
                                                          .getInputStream()
                                  )
                          );

                          StringBuilder result =
                                  new StringBuilder();

                          String line;

                          while (
                                  (line =
                                          reader.readLine())
                                          != null
                          ) {

                              result.append(line);
                          }

                          reader.close();

                          String page =
                                  result.toString()
                                          .toLowerCase(
                                                  Locale.ROOT
                                          );

                          return !page.contains(
                                  "captcha"
                          ) &&
                                  !page.contains(
                                          "cloudflare"
                                  );
                      }

                      return false;

                  } catch (Exception e) {

                      return false;

                  } finally {

                      if (connection != null) {
                          connection.disconnect();
                      }
                  }
              }

              private Notification createNotification(
                      String text
              ) {

                  Intent intent =
                          new Intent(
                                  this,
                                  MainActivity.class
                          );

                  PendingIntent pendingIntent =
                          PendingIntent.getActivity(
                                  this,
                                  0,
                                  intent,
                                  PendingIntent.FLAG_IMMUTABLE |
                                          PendingIntent.FLAG_UPDATE_CURRENT
                          );

                  return new NotificationCompat.Builder(
                          this,
                          CHANNEL_ID
                  )
                          .setSmallIcon(
                                  android.R.drawable
                                          .ic_popup_sync
                          )
                          .setContentTitle(
                                  "BLS Rendez-Vous"
                          )
                          .setContentText(text)
                          .setContentIntent(
                                  pendingIntent
                          )
                          .setOngoing(true)
                          .setPriority(
                                  NotificationCompat
                                          .PRIORITY_LOW
                          )
                          .build();
              }

              private void updateNotification(
                      String text
              ) {

                  NotificationManager manager =
                          (NotificationManager)
                                  getSystemService(
                                          NOTIFICATION_SERVICE
                                  );

                  manager.notify(
                          2001,
                          createNotification(text)
                  );
              }

              private void createChannel() {

                  if (Build.VERSION.SDK_INT >=
                          Build.VERSION_CODES.O) {

                      NotificationChannel channel =
                              new NotificationChannel(
                                      CHANNEL_ID,
                                      "BLS Surveillance",
                                      NotificationManager
                                              .IMPORTANCE_LOW
                              );

                      channel.setDescription(
                              "Surveillance BLS en arrière-plan"
                      );

                      NotificationManager manager =
                              getSystemService(
                                      NotificationManager.class
                              );

                      manager.createNotificationChannel(
                              channel
                      );
                  }
              }

              private void stopMonitoring() {

                  running = false;

                  handler.removeCallbacks(
                          monitorRunnable
                  );

                  stopForeground(
                          STOP_FOREGROUND_REMOVE
                  );

                  stopSelf();
              }

              @Override
              public void onDestroy() {

                  running = false;

                  handler.removeCallbacks(
                          monitorRunnable
                  );

                  super.onDestroy();
              }

              @Nullable
              @Override
              public IBinder onBind(
                      Intent intent
              ) {
                  return null;
              }
          }
          EOF

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Prepare release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/BLS-Rendez-Vous.apk

      - name: Create ZIP
        run: |
          cd release
          zip -j BLS-Rendez-Vous.zip BLS-Rendez-Vous.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Rendez-Vous-APK
          path: release/BLS-Rendez-Vous.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Rendez-Vous-ZIP
          path: release/BLS-Rendez-Vous.zip
