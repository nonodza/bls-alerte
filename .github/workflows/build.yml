          # =====================================================
          # MAIN ACTIVITY
          # =====================================================

          cat > app/src/main/java/com/bls/alerte/MainActivity.kt <<'EOF'
package com.bls.alerte

import android.Manifest
import android.app.NotificationChannel
import android.app.NotificationManager
import android.content.Context
import android.content.Intent
import android.content.pm.PackageManager
import android.graphics.Color
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.widget.*
import androidx.activity.result.contract.ActivityResultContracts
import androidx.appcompat.app.AlertDialog
import androidx.appcompat.app.AppCompatActivity
import androidx.core.app.NotificationCompat
import androidx.core.content.ContextCompat
import androidx.work.*
import java.text.SimpleDateFormat
import java.util.*
import java.util.concurrent.TimeUnit


class MainActivity : AppCompatActivity() {

    private lateinit var statusTitle: TextView
    private lateinit var statusDescription: TextView
    private lateinit var startButton: Button
    private lateinit var checkCount: TextView
    private lateinit var lastCheck: TextView

    private var monitoring = false

    private val prefs by lazy {
        getSharedPreferences("bls_settings", MODE_PRIVATE)
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        setContentView(R.layout.activity_main)

        createNotificationChannel()

        requestNotificationPermission()

        setupInterface()

        restoreState()
    }


    // =========================================================
    // INTERFACE
    // =========================================================

    private fun setupInterface() {

        statusTitle = findViewById(R.id.statusTitle)
        statusDescription = findViewById(R.id.statusDescription)
        startButton = findViewById(R.id.startButton)

        checkCount = findViewById(R.id.checkCount)
        lastCheck = findViewById(R.id.lastCheck)


        val centerSpinner =
            findViewById<Spinner>(R.id.centerSpinner)

        val serviceSpinner =
            findViewById<Spinner>(R.id.serviceSpinner)

        val intervalSpinner =
            findViewById<Spinner>(R.id.intervalSpinner)


        centerSpinner.adapter =
            ArrayAdapter(
                this,
                android.R.layout.simple_spinner_dropdown_item,
                arrayOf(
                    "Alger",
                    "Oran",
                    "Annaba",
                    "Autre centre"
                )
            )


        serviceSpinner.adapter =
            ArrayAdapter(
                this,
                android.R.layout.simple_spinner_dropdown_item,
                arrayOf(
                    "Schengen Visa",
                    "Tourisme",
                    "Visite familiale",
                    "Affaires",
                    "Autre service"
                )
            )


        intervalSpinner.adapter =
            ArrayAdapter(
                this,
                android.R.layout.simple_spinner_dropdown_item,
                arrayOf(
                    "Toutes les 1 minute",
                    "Toutes les 2 minutes",
                    "Toutes les 5 minutes",
                    "Toutes les 10 minutes",
                    "Toutes les 15 minutes"
                )
            )


        centerSpinner.onItemSelectedListener =
            object : AdapterView.OnItemSelectedListener {

                override fun onNothingSelected(parent: AdapterView<*>?) {}

                override fun onItemSelected(
                    parent: AdapterView<*>?,
                    view: android.view.View?,
                    position: Int,
                    id: Long
                ) {

                    prefs.edit()
                        .putString(
                            "center",
                            centerSpinner.selectedItem.toString()
                        )
                        .apply()
                }
            }


        serviceSpinner.onItemSelectedListener =
            object : AdapterView.OnItemSelectedListener {

                override fun onNothingSelected(parent: AdapterView<*>?) {}

                override fun onItemSelected(
                    parent: AdapterView<*>?,
                    view: android.view.View?,
                    position: Int,
                    id: Long
                ) {

                    prefs.edit()
                        .putString(
                            "service",
                            serviceSpinner.selectedItem.toString()
                        )
                        .apply()
                }
            }


        intervalSpinner.onItemSelectedListener =
            object : AdapterView.OnItemSelectedListener {

                override fun onNothingSelected(parent: AdapterView<*>?) {}

                override fun onItemSelected(
                    parent: AdapterView<*>?,
                    view: android.view.View?,
                    position: Int,
                    id: Long
                ) {

                    prefs.edit()
                        .putInt("interval", position)
                        .apply()
                }
            }


        startButton.setOnClickListener {

            if (monitoring) {
                stopMonitoring()
            } else {
                startMonitoring()
            }
        }


        findViewById<Button>(R.id.openBlsButton)
            .setOnClickListener {

                try {

                    val intent = Intent(
                        Intent.ACTION_VIEW,
                        Uri.parse(
                            "https://algeria.blsspainvisa.com/"
                        )
                    )

                    startActivity(intent)

                } catch (e: Exception) {

                    Toast.makeText(
                        this,
                        "Impossible d'ouvrir le site.",
                        Toast.LENGTH_SHORT
                    ).show()
                }
            }


        findViewById<Button>(R.id.logButton)
            .setOnClickListener {

                showLogs()
            }


        findViewById<Button>(R.id.settingsButton)
            .setOnClickListener {

                showSettings()
            }
    }


    // =========================================================
    // START
    // =========================================================

    private fun startMonitoring() {

        monitoring = true

        prefs.edit()
            .putBoolean("monitoring", true)
            .apply()


        statusTitle.text = "●  SURVEILLANCE ACTIVE"

        statusTitle.setTextColor(
            ContextCompat.getColor(
                this,
                R.color.success
            )
        )


        statusDescription.text =
            "Le système surveille les disponibilités."


        startButton.text =
            "■  ARRÊTER LA SURVEILLANCE"


        val intervalIndex =
            prefs.getInt("interval", 2)


        val minutes =
            when (intervalIndex) {

                0 -> 1
                1 -> 2
                2 -> 5
                3 -> 10
                else -> 15
            }


        val request =
            PeriodicWorkRequestBuilder<MonitorWorker>(
                minutes.toLong(),
                TimeUnit.MINUTES
            )
                .setConstraints(
                    Constraints.Builder()
                        .setRequiredNetworkType(
                            NetworkType.CONNECTED
                        )
                        .build()
                )
                .build()


        WorkManager
            .getInstance(this)
            .enqueueUniquePeriodicWork(
                "BLS_MONITOR",
                ExistingPeriodicWorkPolicy.UPDATE,
                request
            )


        Toast.makeText(
            this,
            "Surveillance démarrée",
            Toast.LENGTH_SHORT
        ).show()
    }


    // =========================================================
    // STOP
    // =========================================================

    private fun stopMonitoring() {

        monitoring = false

        prefs.edit()
            .putBoolean("monitoring", false)
            .apply()


        WorkManager
            .getInstance(this)
            .cancelUniqueWork(
                "BLS_MONITOR"
            )


        statusTitle.text =
            "●  SURVEILLANCE ARRÊTÉE"


        statusTitle.setTextColor(
            ContextCompat.getColor(
                this,
                R.color.danger
            )
        )


        statusDescription.text =
            "La surveillance n'est pas active."


        startButton.text =
            "▶  DÉMARRER LA SURVEILLANCE"


        Toast.makeText(
            this,
            "Surveillance arrêtée",
            Toast.LENGTH_SHORT
        ).show()
    }


    // =========================================================
    // RESTORE
    // =========================================================

    private fun restoreState() {

        monitoring =
            prefs.getBoolean(
                "monitoring",
                false
            )


        val count =
            prefs.getInt(
                "checks",
                0
            )


        checkCount.text =
            count.toString()


        lastCheck.text =
            prefs.getString(
                "lastCheck",
                "—"
            )


        if (monitoring) {

            statusTitle.text =
                "●  SURVEILLANCE ACTIVE"

            statusTitle.setTextColor(
                ContextCompat.getColor(
                    this,
                    R.color.success
                )
            )

            statusDescription.text =
                "Le système surveille les disponibilités."

            startButton.text =
                "■  ARRÊTER LA SURVEILLANCE"

        }
    }


    // =========================================================
    // LOGS
    // =========================================================

    private fun showLogs() {

        val logs =
            prefs.getString(
                "logs",
                "Aucune activité enregistrée."
            )


        AlertDialog.Builder(this)

            .setTitle("📋 Journal des activités")

            .setMessage(logs)

            .setPositiveButton(
                "OK",
                null
            )

            .setNegativeButton(
                "Effacer"
            ) { _, _ ->

                prefs.edit()
                    .remove("logs")
                    .apply()
            }

            .show()
    }


    // =========================================================
    // SETTINGS
    // =========================================================

    private fun showSettings() {

        val options =
            arrayOf(
                "Notifications",
                "Réinitialiser les statistiques",
                "Informations sur l'application"
            )


        AlertDialog.Builder(this)

            .setTitle("⚙️ Paramètres")

            .setItems(options) { _, which ->

                when (which) {

                    0 -> {

                        Toast.makeText(
                            this,
                            "Les notifications sont activées.",
                            Toast.LENGTH_SHORT
                        ).show()
                    }


                    1 -> {

                        prefs.edit()
                            .putInt("checks", 0)
                            .putString("lastCheck", "—")
                            .apply()

                        checkCount.text = "0"

                        lastCheck.text = "—"
                    }


                    2 -> {

                        AlertDialog.Builder(this)

                            .setTitle("BLS Alerte DZ")

                            .setMessage(
                                "BLS Alerte DZ PRO\n\n" +
                                "Version 3.0\n\n" +
                                "Application de surveillance des disponibilités BLS."
                            )

                            .setPositiveButton(
                                "OK",
                                null
                            )

                            .show()
                    }
                }
            }

            .show()
    }


    // =========================================================
    // NOTIFICATION
    // =========================================================

    private fun createNotificationChannel() {

        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {

            val channel =
                NotificationChannel(
                    "BLS_ALERT",
                    "BLS Alertes",
                    NotificationManager.IMPORTANCE_HIGH
                )

            channel.description =
                "Alertes de disponibilité BLS"


            val manager =
                getSystemService(
                    Context.NOTIFICATION_SERVICE
                ) as NotificationManager


            manager.createNotificationChannel(
                channel
            )
        }
    }


    private fun requestNotificationPermission() {

        if (
            Build.VERSION.SDK_INT >= 33 &&
            ContextCompat.checkSelfPermission(
                this,
                Manifest.permission.POST_NOTIFICATIONS
            ) != PackageManager.PERMISSION_GRANTED
        ) {

            requestPermissions(
                arrayOf(
                    Manifest.permission.POST_NOTIFICATIONS
                ),
                100
            )
        }
    }


    // =========================================================
    // NOTIFICATION ALERT
    // =========================================================

    fun sendAlert(message: String) {

        val notification =
            NotificationCompat.Builder(
                this,
                "BLS_ALERT"
            )
                .setSmallIcon(
                    android.R.drawable.ic_dialog_info
                )
                .setContentTitle(
                    "🇩🇿 BLS Alerte DZ"
                )
                .setContentText(message)
                .setPriority(
                    NotificationCompat.PRIORITY_HIGH
                )
                .setAutoCancel(true)
                .build()


        val manager =
            getSystemService(
                Context.NOTIFICATION_SERVICE
            ) as NotificationManager


        manager.notify(
            1001,
            notification
        )
    }
}


class MonitorWorker(
    context: Context,
    params: WorkerParameters
) : Worker(context, params) {

    override fun doWork(): Result {

        val prefs =
            applicationContext.getSharedPreferences(
                "bls_settings",
                Context.MODE_PRIVATE
            )


        val count =
            prefs.getInt(
                "checks",
                0
            ) + 1


        val time =
            SimpleDateFormat(
                "HH:mm:ss",
                Locale.getDefault()
            ).format(Date())


        val center =
            prefs.getString(
                "center",
                "Alger"
            )


        val service =
            prefs.getString(
                "service",
                "Schengen Visa"
            )


        val oldLogs =
            prefs.getString(
                "logs",
                ""
            )


        val newLog =
            "[$time] Vérification — $center — $service"


        val logs =
            "$newLog\n$oldLogs"
                .take(5000)


        prefs.edit()
            .putInt(
                "checks",
                count
            )
            .putString(
                "lastCheck",
                time
            )
            .putString(
                "logs",
                logs
            )
            .apply()


        /*
         * =====================================================
         * IMPORTANT
         * =====================================================
         *
         * Ici se place la logique de vérification réelle
         * du site BLS.
         *
         * L'application ne contourne pas CAPTCHA,
         * authentification ou mécanismes de sécurité.
         *
         * Quand une disponibilité est détectée légalement,
         * une notification peut être envoyée ici.
         */


        return Result.success()
    }
}
EOF


      # =========================================================
      # 5. DOWNLOAD GRADLE
      # =========================================================

      - name: Install Gradle
        run: |

          wget -q \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp/

          echo "/tmp/gradle-8.2/bin" >> $GITHUB_PATH


      # =========================================================
      # 6. BUILD APK
      # =========================================================

      - name: Build APK
        run: |

          gradle assembleDebug --no-daemon


      # =========================================================
      # 7. UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-DZ-v3.0-PRO
          path: app/build/outputs/apk/debug/app-debug.apk
