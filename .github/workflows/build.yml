name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Fix gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Verify MainActivity source
        run: |
          echo "===== MAINACTIVITY SOURCE CHECK ====="

          if grep -q 'BLS TEST 248' app/src/main/java/com/bls/rendezvous/MainActivity.java; then
            echo "RESULT: BLS TEST 248 FOUND IN SOURCE"
          else
            echo "RESULT: BLS TEST 248 NOT FOUND IN SOURCE"
            exit 1
          fi

          echo "===== END SOURCE CHECK ====="

      - name: Build Debug APK
        run: |
          ./gradlew clean
          ./gradlew assembleDebug

      - name: Check APK exists
        run: |
          echo "===== APK CHECK ====="
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "===== END APK CHECK ====="

      - name: Inspect APK
        run: |
          echo "===== APK CONTENT CHECK ====="

          unzip -l app/build/outputs/apk/debug/app-debug.apk | head -30

          echo "===== SEARCHING APK FOR TEST TEXT ====="

          unzip -p app/build/outputs/apk/debug/app-debug.apk \
            resources.arsc 2>/dev/null | strings | grep -F "BLS TEST 248" || true

          echo "===== END APK CHECK ====="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
