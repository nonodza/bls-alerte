            protected void onCreate(Bundle b){super.onCreate(b); p=getSharedPreferences("bls",MODE_PRIVATE); lang=p.getString("lang","FR"); theme=p.getString("theme","LIGHT"); apply(); main();}
            void apply(){ switch(theme){ case "DARK": bg=Color.parseColor("#111827"); card=Color.parseColor("#1F2937"); txt=Color.WHITE; sub=Color.parseColor("#9CA3AF"); break; case "PURPLE": bg=Color.parseColor("#F5F3FF"); card=Color.WHITE; txt=Color.parseColor("#4C1D95"); sub=Color.parseColor("#7C3AED"); break; case "OCEAN": bg=Color.parseColor("#ECFEFF"); card=Color.WHITE; txt=Color.parseColor("#0E7490"); sub=Color.parseColor("#0891B2"); break; default: bg=Color.WHITE; card=Color.WHITE; txt=Color.parseColor("#111827"); sub=Color.parseColor("#6B7280"); } }
            void main(){ LinearLayout all=new LinearLayout(this); all.setOrientation(1); all.setBackgroundColor(bg); LinearLayout top=new LinearLayout(this); top.setOrientation(1); top.setPadding(22,28,22,20); top.setBackgroundColor(bg); TextView prem=new TextView(this); prem.setText(" 🎨 "+theme+" • 🌐 "+lang+" • BG Service "); prem.setTextColor(txt); prem.setGravity(Gravity.CENTER); prem.setPadding(22,10,22,10); prem.setTextSize(10); prem.setTypeface(null,Typeface.BOLD); GradientDrawable gd=new GradientDrawable(); gd.setCornerRadius(24); gd.setColor(card); gd.setStroke(1,Color.parseColor("#E5E7EB")); prem.setBackground(gd); LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(-2,-2); pp.gravity=Gravity.CENTER; prem.setLayoutParams(pp); top.addView(prem); TextView title=new TextView(this); title.setText("Que souhaitez-vous\nsurveiller?"); title.setTextColor(txt); title.setTextSize(21); title.setTypeface(null,Typeface.BOLD); title.setPadding(24,22,24,6); ScrollView sv=new ScrollView(this); sv.setBackgroundColor(bg); LinearLayout content=new LinearLayout(this); content.setOrientation(1); content.setPadding(0,0,0,110); TextView s1=new TextView(this); s1.setText("Centres - Service Arriere-plan"); s1.setTextColor(txt); s1.setTypeface(null,Typeface.BOLD); s1.setPadding(24,14,24,8); LinearLayout cards=new LinearLayout(this); cards.setOrientation(0); cards.setPadding(16,6,16,10); cards.addView(card("Alger")); cards.addView(card("Oran")); cards.addView(card("Annaba")); LinearLayout sc=new LinearLayout(this); sc.setOrientation(1); sc.setPadding(20,16,20,16); GradientDrawable sbg=new GradientDrawable(); sbg.setCornerRadius(20); sbg.setColor(card); sbg.setStroke(1,Color.parseColor("#F3F4F6")); sc.setBackground(sbg); sc.setElevation(6); LinearLayout.LayoutParams scp=new LinearLayout.LayoutParams(-1,-2); scp.setMargins(24,18,24,0); sc.setLayoutParams(scp); status=new TextView(this); status.setText("● Pret - BG Service"); status.setTextColor(Color.parseColor("#059669")); status.setTypeface(null,Typeface.BOLD); cnt=new TextView(this); cnt.setText("0 verifs"); cnt.setTextColor(sub); cnt.setPadding(0,8,0,0); log=new TextView(this); log.setText("Service Notification pret\n"); log.setTextColor(sub); log.setTextSize(11); log.setPadding(0,10,0,0); sc.addView(status); sc.addView(cnt); sc.addView(log); content.addView(title); content.addView(s1); content.addView(cards); content.addView(sc); sv.addView(content); LinearLayout bot=new LinearLayout(this); bot.setOrientation(0); bot.setBackgroundColor(card); bot.setPadding(0,12,0,18); bot.setElevation(16); bot.addView(nav("Accueil",true)); bot.addView(nav("Centres",false)); bot.addView(nav("Alertes",false)); bot.addView(nav("Plus",false)); all.addView(top); all.addView(sv); all.addView(bot); setContentView(all); cards.getChildAt(0).setOnClickListener(v->start("Alger")); cards.getChildAt(1).setOnClickListener(v->start("Oran")); cards.getChildAt(2).setOnClickListener(v
