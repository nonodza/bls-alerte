name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build REAL BLS App FIX
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'E'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          E
          cat > app/build.gradle << 'E'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.bls.alerte'
            compileSdk 34
            defaultConfig {
              applicationId "com.bls.alerte"
              minSdk 21
              targetSdk 34
              versionCode 21
              versionName "2.1-FIX"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          E
          cat > app/src/main/AndroidManifest.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="BLS Alerte DZ" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          E
          cat > app/src/main/java/com/bls/alerte/MainActivity.kt << 'E'
          package com.bls.alerte
          import android.app.Activity
          import android.os.*
          import android.widget.*
          import okhttp3.*
          import java.io.IOException
          class MainActivity : Activity() {
            private lateinit var status: TextView
            private lateinit var log: TextView
            private var isRunning = false
            private var count = 0
            private val client = OkHttpClient()
            private val handler = Handler(Looper.getMainLooper())
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40,100,40,40) }
              val title = TextView(this).apply { text="🇩🇿 BLS Alerte DZ v2.1"; textSize=22f; setPadding(0,0,0,30) }
              val spinnerType = Spinner(this)
              val types = arrayOf("National Visa", "Schengen Visa", "Legalisation")
              spinnerType.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, types)
              val spinnerCentre = Spinner(this)
              val centres = arrayOf("Alger", "Oran", "Annaba")
              spinnerCentre.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, centres)
              status = TextView(this).apply { text="جاهز..."; textSize=18f; setPadding(0,30,0,20) }
              log = TextView(this).apply { text="السجل:\n"; textSize=14f }
              val btn = Button(this).apply { text="▶️ ابدأ المراقبة" }
              val scroll = ScrollView(this).apply { addView(log) }
              btn.setOnClickListener {
                if(!isRunning) { isRunning=true; btn.text="⏹️ إيقاف"; checkBLS() } 
                else { isRunning=false; btn.text="▶️ ابدأ"; handler.removeCallbacksAndMessages(null) }
              }
              layout.addView(title)
              layout.addView(spinnerType)
              layout.addView(spinnerCentre)
              layout.addView(btn)
              layout.addView(status)
              layout.addView(scroll)
              setContentView(layout)
            }
            fun checkBLS() {
              if(!isRunning) return
              count++
              status.text = "🔍 فحص $count - ${java.text.SimpleDateFormat("HH:mm:ss").format(java.util.Date())}"
              log.append("[$count] فحص...\n")
              val request = Request.Builder().url("https://algeria.blsspainvisa.com/book_appointment.php").build()
              client.newCall(request).enqueue(object: Callback {
                override fun onFailure(call: Call, e: IOException) {
                  handler.post { log.append("خطأ: ${e.message}\n") }
                  handler.postDelayed({ checkBLS() }, 5000)
                }
                override fun onResponse(call: Call, response: Response) {
                  val body = response.body?.string() ?: ""
                  handler.post {
                    if(body.contains("no appointment", true)) log.append("-> لا يوجد موعد\n")
                    else { log.append("🎉 يوجد موعد!!!\n"); status.text="🎉 موعد متاح!!!"; try { val vib = getSystemService(VIBRATOR_SERVICE) as Vibrator; vib.vibrate(VibrationEffect.createOneShot(2000, 255)) } catch(e:Exception){} }
                  }
                  handler.postDelayed({ checkBLS() }, 8000)
                }
              })
            }
          }
          E
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-FIXED
          path: app/build/outputs/apk/debug/*.apk
