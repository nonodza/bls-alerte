name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build
        run: |
          cat > settings.gradle << 'E'
          include ':app'
          E
          cat > build.gradle << 'E'
          buildscript {
            ext.kotlin_version = '1.9.10'
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.1.4'
              classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          E
          echo "android.useAndroidX=true" > gradle.properties
          mkdir -p app/src/main/java/com/bls/alerte
          cat > app/build.gradle << 'E'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.bls.alerte'
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.bls.alerte"
              minSdkVersion 21
              targetSdkVersion 34
              versionCode 6
              versionName "1.0"
            }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.10.1'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          E
          cat > app/src/main/AndroidManifest.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="BLS Alerte" android:theme="@android:style/Theme.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          E
          cat > app/src/main/java/com/bls/alerte/MainActivity.kt << 'E'
          package com.bls.alerte
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val tv = TextView(this)
              tv.text = "BLS Alerte DZ - OK FINAL!"
              tv.textSize = 22f
              tv.setPadding(50,300,50,50)
              setContentView(tv)
            }
          }
          E
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-APK
          path: app/build/outputs/apk/debug/*.apk
