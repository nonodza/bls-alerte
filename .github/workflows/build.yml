name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Fix gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi
          chmod +x gradlew

      - name: Verify MainActivity source
        run: |
          echo "===== MAINACTIVITY CHECK ====="
          if grep -q 'BLS TEST 248' app/src/main/java/com/bls/rendezvous/MainActivity.java; then
            echo "RESULT: BLS TEST 248 FOUND"
          else
            echo "RESULT: BLS TEST 248 NOT FOUND"
            exit 1
          fi
          echo "===== END CHECK ====="

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
