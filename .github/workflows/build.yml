name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip -d $HOME/android
          mkdir -p $HOME/android/cmdline-tools/latest
          mv $HOME/android/cmdline-tools/* $HOME/android/cmdline-tools/latest/ 2>/dev/null || true
          export ANDROID_HOME=$HOME/android
          export PATH=$HOME/android/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$HOME/android" >> $GITHUB_ENV
      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> $GITHUB_PATH
      - name: Build
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/bls/alerte
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "BLSAlerte"; include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.bls.alerte'
            compileSdk 34
            defaultConfig { applicationId 'com.bls.alerte'; minSdk 23; targetSdk 34; versionCode 21; versionName '6.7' }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.VIBRATE"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:label="BLS ULTRA" android:theme="@android:style/Theme.Light.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <service android:name=".MonitorService" android:exported="false"/>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/bls/alerte/MonitorService.java <<'EOF'
          package com.bls.alerte; import android.app.*; import android.content.Intent; import android.os.IBinder; import androidx.core.app.NotificationCompat; public class MonitorService extends Service { public static String currentCity="Alger"; public IBinder onBind(Intent i){return null;} public int onStartCommand(Intent intent,int f,int id){ String a=intent!=null?intent.getStringExtra("action"):"start"; if("stop".equals(a)){stopForeground(true);stopSelf();return START_NOT_STICKY;} String chId="bls_channel"; NotificationManager nm=(NotificationManager)getSystemService(NOTIFICATION_SERVICE); if(android.os.Build.VERSION.SDK_INT>=26){ NotificationChannel ch=new NotificationChannel(chId,"BLS",NotificationManager.IMPORTANCE_LOW); nm.createNotificationChannel(ch);} Intent stopI=new Intent(this,MonitorService.class); stopI.putExtra("action","stop"); PendingIntent stopPI=PendingIntent.getService(this,1,stopI,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE); Intent openI=new Intent(this,MainActivity.class); PendingIntent openPI=PendingIntent.getActivity(this,0,openI,PendingIntent.FLAG_UPDATE
