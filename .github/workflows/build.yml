name: Build BLS Alerte DZ

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Create Android Project
        run: |

          rm -rf app
          rm -f build.gradle settings.gradle gradle.properties

          mkdir -p app/src/main/java/com/bls/alerte
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable


          # ==========================
          # SETTINGS
          # ==========================

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "BLSAlerteDZ"

include(":app")
EOF


          # ==========================
          # GRADLE PROPERTIES
          # ==========================

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
EOF


          # ==========================
          # BUILD GRADLE
          # ==========================

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.2.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
}
EOF


          # ==========================
          # APP GRADLE
          # ==========================

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {

    namespace 'com.bls.alerte'

    compileSdk 34

    defaultConfig {

        applicationId "com.bls.alerte"

        minSdk 23

        targetSdk 34

        versionCode 30

        versionName "3.0"

    }

    buildTypes {

        release {

            minifyEnabled false

            shrinkResources false

        }

    }

    compileOptions {

        sourceCompatibility JavaVersion.VERSION_17

        targetCompatibility JavaVersion.VERSION_17

    }

    kotlinOptions {

        jvmTarget = "17"

    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation 'com.google.android.material:material:1.12.0'

}
EOF


          # ==========================
          # MANIFEST
          # ==========================

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<?xml version="1.0" encoding="utf-8"?>

<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <uses-permission
        android:name="android.permission.INTERNET" />

    <uses-permission
        android:name="android.permission.VIBRATE" />

    <application
        android:allowBackup="true"
        android:label="BLS Alerte DZ"
        android:theme="@style/AppTheme">

        <activity
            android:name=".MainActivity"
            android:exported="true">

            <intent-filter>

                <action
                    android:name="android.intent.action.MAIN" />

                <category
                    android:name="android.intent.category.LAUNCHER" />

            </intent-filter>

        </activity>

    </application>

</manifest>
EOF


          # ==========================
          # COLORS
          # ==========================

          cat > app/src/main/res/values/colors.xml <<'EOF'
<?xml version="1.0" encoding="utf-8
