name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Project
        run: |
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          cat > build.gradle << 'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.4'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.10'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.bls.alerte'
              compileSdk 34
              defaultConfig {
                  applicationId "com.bls.alerte"
                  minSdk 21
                  targetSdk 34
                  versionCode 2
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE
          cat > app/src/main/AndroidManifest.xml << 'MAN'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="BLS Alerte" android:theme="@android:style/Theme.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MAN
          cat > app/src/main/java/com/bls/alerte/MainActivity.kt << 'KT'
          package com.bls.alerte
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val tv = TextView(this)
                  tv.text = "BLS Alerte DZ - OK!"
                  tv.textSize = 24f
                  tv.setPadding(50,300,50,50)
                  setContentView(tv)
              }
          }
          KT
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-APK
          path: app/build/outputs/apk/debug/app-debug.apk
