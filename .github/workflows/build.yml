name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build BLS v3.0 ULTRA PRO DARK
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'E'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          E
          cat > app/build.gradle << 'E'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.bls.alerte'
            compileSdk 34
            defaultConfig {
              applicationId "com.bls.alerte"
              minSdk 21
              targetSdk 34
              versionCode 30
              versionName "3.0-ULTRA"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          E
          cat > app/src/main/AndroidManifest.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="BLS Alerte DZ" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          E
          cat > app/src/main/java/com/bls/alerte/MainActivity.kt << 'E'
          package com.bls.alerte
          import android.app.Activity
          import android.content.Intent
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.*
          import android.view.Gravity
          import android.widget.*
          import okhttp3.*
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.*
          class MainActivity : Activity() {
            private lateinit var status: TextView
            private lateinit var log: TextView
            private var isRunning = false
            private var count = 0
            private val client = OkHttpClient.Builder().build()
            private val handler = Handler(Looper.getMainLooper())
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val bgColor = Color.parseColor("#120023")
              val cardColor = Color.parseColor("#1E0A3A")
              val purple = Color.parseColor("#8B5CF6")
              val neonPurple = Color.parseColor("#A855F7")

              val root = LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; setBackgroundColor(bgColor) }
              
              // TOP BAR with 3 lines
              val topBar = LinearLayout(this).apply { orientation=LinearLayout.HORIZONTAL; setPadding(40,60,40,20); gravity=Gravity.CENTER_VERTICAL }
              val menuBtn = TextView(this).apply { text="☰"; textSize=26f; setTextColor(Color.WHITE); setPadding(0,0,30,0) }
              val topTitle = TextView(this).apply { text="BLS Alerte DZ"; textSize=18f; setTextColor(Color.WHITE); setTypeface(null, Typeface.BOLD) }
              val langBtn = TextView(this).apply { text="AR"; textSize=14f; setTextColor(purple); setPadding(20,10,20,10)
                background = GradientDrawable().apply { shape=GradientDrawable.RECTANGLE; cornerRadius=30f; setStroke(2, purple) }
              }
              topBar.addView(menuBtn); topBar.addView(topTitle)
              val spacer = Space(this).apply { layoutParams=LinearLayout.LayoutParams(0,0,1f) }
              topBar.addView(spacer); topBar.addView(langBtn)

              // LOGO + TITLE like screenshot
              val center = LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; gravity=Gravity.CENTER; setPadding(0,40,0,30) }
              val logoBg = LinearLayout(this).apply { 
                val d = GradientDrawable(); d.shape=GradientDrawable.OVAL; d.colors=intArrayOf(Color.parseColor("#6D28D9"), Color.parseColor("#3B0764")); d.setSize(240,240)
                background=d; gravity=Gravity.CENTER; setPadding(20,20,20,20)
              }
              val logo = TextView(this).apply { 
                text="BLS\n🇩🇿"; textSize=32f; setTextColor(Color.WHITE); gravity=Gravity.CENTER; setTypeface(null, Typeface.BOLD)
                val d2 = GradientDrawable(); d2.shape=GradientDrawable.OVAL; d2.setColor(Color.parseColor("#8B5CF6")); d2.setStroke(4, Color.parseColor("#A78BFA")); d2.setSize(180,180)
                background=d2; setPadding(30,30,30,30)
              }
              logoBg.addView(logo)
              val mainTitle = TextView(this).apply { text="BLS Alerte Pro"; textSize=26f; setTextColor(Color.WHITE); setTypeface(null, Typeface.BOLD); gravity=Gravity.CENTER; setPadding(0,30,0,10) }
              val subTitle = TextView(this).apply { text="مراقبة مواعيد BLS بذكاء اصطناعي"; textSize=14f; setTextColor(Color.parseColor("#A5B4FC")); gravity=Gravity.CENTER }
              center.addView(logoBg); center.addView(mainTitle); center.addView(subTitle)

              // SEARCH BAR STYLE CARD
              val searchCard = LinearLayout(this).apply { 
                orientation=LinearLayout.HORIZONTAL; setPadding(30,20,30,20)
                val gd = GradientDrawable(); gd.shape=GradientDrawable.RECTANGLE; gd.cornerRadius=40f; gd.setColor(Color.parseColor("#1E1B4B")); gd.setStroke(2, Color.parseColor("#4C1D95"))
                background=gd; setMargins(30,20,30,10)
              }
              val spinner = Spinner(this).apply { 
                layoutParams=LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
              }
              spinner.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, arrayOf("🇩🇿 Schengen - Alger", "🇩🇿 National - Alger", "🟢 Schengen - Oran", "🔵 National - Annaba")).apply {
                setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item)
              }
              searchCard.addView(spinner)

              // STATUS CARD
              val statusCard = LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; setPadding(30,25,30,25)
                val gd = GradientDrawable(); gd.cornerRadius=25f; gd.setColor(cardColor); background=gd; setMargins(30,15,30,10)
              }
              status = TextView(this).apply { text="⚪ جاهز للمراقبة"; textSize=15f; setTextColor(Color.WHITE) }
              log = TextView(this).apply { text="📜 السجل:\n- لا يوجد فحص بعد"; textSize=12f; setTextColor(Color.parseColor("#C4B5FD")); setPadding(0,15,0,0) }
              statusCard.addView(status); statusCard.addView(log)

              // BUTTONS
              val btnStart = TextView(this).apply { 
                text="▶️ ابدأ المراقبة الذكية"; textSize=16f; setTextColor(Color.WHITE); gravity=Gravity.CENTER; setPadding(0,35,0,35)
                val gd = GradientDrawable(); gd.cornerRadius=30f; gd.colors=intArrayOf(Color.parseColor("#7C3AED"), Color.parseColor("#4F46E5")); gd.orientation=GradientDrawable.Orientation.LEFT_RIGHT; background=gd
                setMargins(30,20,30,10)
              }
              val btnBLS = TextView(this).apply {
                text="🌐 افتح موقع BLS"; textSize=14f; setTextColor(Color.parseColor("#A5B4FC")); gravity=Gravity.CENTER; setPadding(0,25,0,25)
                val gd = GradientDrawable(); gd.cornerRadius=25f; gd.setColor(Color.parseColor("#1E1B4B")); gd.setStroke(1, Color.parseColor("#4C1D95")); background=gd
                setMargins(30,10,30,0)
              }

              // BOTTOM NAV like screenshot
              val bottomNav = LinearLayout(this).apply { orientation=LinearLayout.HORIZONTAL; gravity=Gravity.CENTER; setPadding(0,25,0,25); setBackgroundColor(Color.parseColor("#0F0A1E")) }
              fun navItem(icon:String, active:Boolean): TextView {
                return TextView(this).apply { text=icon; textSize=22f; gravity=Gravity.CENTER; setPadding(40,0,40,0)
                  setTextColor(if(active) neonPurple else Color.parseColor("#6B7280")) }
              }
              bottomNav.addView(navItem("⌂", true))
              bottomNav.addView(navItem("◫", false))
              bottomNav.addView(navItem("⬇", false))
              bottomNav.addView(navItem("⚙", false))

              btnStart.setOnClickListener {
                if(!isRunning) { isRunning=true; btnStart.text="⏹️ إيقاف المراقبة"; count=0; checkBLS() } 
                else { isRunning=false; btnStart.text="▶️ ابدأ المراقبة الذكية"; handler.removeCallbacksAndMessages(null); status.text="⏸️ متوقف" }
              }
              btnBLS.setOnClickListener { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://algeria.blsspainvisa.com"))) }
              menuBtn.setOnClickListener { Toast.makeText(this, "☰ القائمة: الإعدادات - اللغة - حول التطبيق - الدعم", Toast.LENGTH_LONG).show() }

              root.addView(topBar); root.addView(center); root.addView(searchCard); root.addView(statusCard); root.addView(btnStart); root.addView(btnBLS)
              val bottomWrapper = LinearLayout(this).apply { orientation=LinearLayout.VERTICAL; layoutParams=LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f) }
              root.addView(bottomWrapper)
              root.addView(bottomNav)
              setContentView(root)
            }
            fun LinearLayout.setMargins(l:Int,t:Int,r:Int,b:Int){ (layoutParams as? LinearLayout.LayoutParams)?.setMargins(l,t,r,b) ?: run { layoutParams=LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { setMargins(l,t,r,b) } } }
            fun checkBLS(){
              if(!isRunning) return
              count++; val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
              status.text = "🔍 فحص ذكي #$count - $time"; log.text = "[$time] فحص BLS... ${if(count>1) "\n" + log.text else ""}"
              val req = Request.Builder().url("https://algeria.blsspainvisa.com/book_appointment.php").header("User-Agent","Mozilla/5.0").build()
              client.newCall(req).enqueue(object:Callback{
                override fun onFailure(call:Call,e:IOException){ handler.post{ status.text="❌ خطأ اتصال"; log.text="❌ ${e.message}\n"+log.text }; handler.postDelayed({checkBLS()},10000) }
                override fun onResponse(call:Call,response:Response){
                  val body = response.body?.string()?.lowercase() ?: ""
                  handler.post{
                    val noSlot = body.contains("no appointment") || body.contains("no slot") || body.contains("currently") || body.length < 800
                    if(noSlot){ log.text="[$time] -> لا يوجد موعد\n"+log.text } else {
                      log.text="🎉 موعد محتمل!!! [$time]\n"+log.text; status.text="🎉🎉 موعد محتمل!"
                      try{ (getSystemService(VIBRATOR_SERVICE) as Vibrator).vibrate(VibrationEffect.createWaveform(longArrayOf(0,400,200,400,200,800),-1)) }catch(e:Exception){}
                    }
                  }
                  handler.postDelayed({checkBLS()},15000)
                }
              })
            }
          }
          E
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLS-v3.0-ULTRA-DARK-PRO
          path: app/build/outputs/apk/debug/*.apk
