name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build BLS v2.2 PRO
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'E'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          E
          cat > app/build.gradle << 'E'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.bls.alerte'
            compileSdk 34
            defaultConfig {
              applicationId "com.bls.alerte"
              minSdk 21
              targetSdk 34
              versionCode 22
              versionName "2.2-PRO"
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          E
          cat > app/src/main/AndroidManifest.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application android:label="BLS Alerte DZ" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          E
          cat > app/src/main/java/com/bls/alerte/MainActivity.kt << 'E'
          package com.bls.alerte
          import android.app.Activity
          import android.content.Intent
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.*
          import android.widget.*
          import okhttp3.*
          import java.io.IOException
          import java.text.SimpleDateFormat
          import java.util.*
          class MainActivity : Activity() {
            private lateinit var status: TextView
            private lateinit var log: TextView
            private var isRunning = false
            private var count = 0
            private val client = OkHttpClient.Builder().followRedirects(true).build()
            private val handler = Handler(Looper.getMainLooper())
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val layout = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(30,80,30,30) }
              val title = TextView(this).apply { text="🇩🇿 BLS Alerte DZ v2.2 PRO"; textSize=20f; setPadding(0,0,0,20) }
              val spinnerType = Spinner(this)
              spinnerType.adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, arrayOf("Schengen Visa - Alger", "National Visa - Alger", "Schengen - Oran", "National - Oran"))
              status = TextView(this).apply { text="جاهز... اختار و ابدأ"; textSize=16f; setPadding(0,20,0,10) }
              log = TextView(this).apply { text="📜 السجل:\n"; textSize=13f }
              val btn = Button(this).apply { text="▶️ ابدأ المراقبة الذكية" }
              val btnOpen = Button(this).apply { text="🌐 افتح موقع BLS"; isEnabled=true }
              btnOpen.setOnClickListener { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://algeria.blsspainvisa.com"))) }
              val scroll = ScrollView(this).apply { addView(log) }
              btn.setOnClickListener {
                if(!isRunning) { isRunning=true; btn.text="⏹️ إيقاف"; count=0; checkBLS() } 
                else { isRunning=false; btn.text="▶️ ابدأ المراقبة الذكية"; handler.removeCallbacksAndMessages(null); status.text="⏸️ متوقف" }
              }
              layout.addView(title); layout.addView(spinnerType); layout.addView(btn); layout.addView(btnOpen); layout.addView(status); layout.addView(scroll)
              setContentView(layout)
            }
            fun checkBLS() {
              if(!isRunning) return
              count++
              val time = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
              status.text = "🔍 فحص ذكي #$count - $time"
              log.append("[$count - $time] فحص BLS...\n")
              val request = Request.Builder()
                .url("https://algeria.blsspainvisa.com/book_appointment.php")
                .header("User-Agent", "Mozilla/5.0 (Android) BLS-Alerte-DZ")
                .build()
              client.newCall(request).enqueue(object: Callback {
                override fun onFailure(call: Call, e: IOException) {
                  handler.post { log.append("❌ خطأ: ${e.message}\n"); status.text="❌ خطأ اتصال" }
                  handler.postDelayed({ checkBLS() }, 10000)
                }
                override fun onResponse(call: Call, response: Response) {
                  val body = response.body?.string()?.lowercase() ?: ""
                  handler.post {
                    val noSlot = body.contains("no appointment") || body.contains("no slot") || body.contains("not available") || body.contains("complet") || body.contains("no hay") || body.length < 500
                    if(noSlot || body.contains("currently")) {
                      log.append(" -> لا يوجد موعد حاليا\n")
                    } else {
                      log.append("🎉🎉 احتمال موعد!!! افتح الموقع\n")
                      status.text="🎉🎉 موعد محتمل!!!"
                      try {
                        val vib = getSystemService(VIBRATOR_SERVICE) as Vibrator
                        vib.vibrate(VibrationEffect.createWaveform(longArrayOf(0,500,200,500,200,1000), -1))
                        val notif = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                        RingtoneManager.getRingtone(this@MainActivity, notif).play()
                      } catch(e:Exception){}
                    }
                    val sv = (log.parent as? ScrollView)
                    sv?.post { sv.fullScroll(ScrollView.FOCUS_DOWN) }
                  }
                  handler.postDelayed({ checkBLS() }, 15000)
                }
              })
            }
          }
          E
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-v2.2-PRO
          path: app/build/outputs/apk/debug/*.apk
