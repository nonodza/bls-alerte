name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build
        run: |
          rm -rf app build.gradle settings.gradle
          mkdir -p app/src/main/java/com/bls/alerte
          echo "include ':app'" > settings.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'E'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.2.2'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
          }
          allprojects { repositories { google(); mavenCentral() } }
          E
          cat > app/build.gradle << 'E'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          android {
            namespace 'com.bls.alerte'
            compileSdk 34
            defaultConfig {
              applicationId "com.bls.alerte"
              minSdk 21
              targetSdk 34
              versionCode 10
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          E
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'E'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="BLS Alerte" android:theme="@android:style/Theme.Light">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          E
          cat > app/src/main/java/com/bls/alerte/MainActivity.kt << 'E'
          package com.bls.alerte
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import android.widget.TextView
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val tv = TextView(this)
              tv.text = "BLS Alerte DZ - FINAL OK v10!"
              tv.textSize = 24f
              tv.setPadding(50,300,50,50)
              setContentView(tv)
            }
          }
          E
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.5
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BLS-Alerte-APK
          path: app/build/outputs/apk/debug/*.apk
