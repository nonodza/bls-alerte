name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmd.zip
          unzip -q cmd.zip -d $HOME/android
          mkdir -p $HOME/android/cmdline-tools/latest
          mv $HOME/android/cmdline-tools/* $HOME/android/cmdline-tools/latest/ 2>/dev/null ||
